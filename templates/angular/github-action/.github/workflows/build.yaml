name: Build

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'release/**'

permissions:
  contents: read
  id-token: write
  packages: write

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Calculate Docker Tag
        id: tag
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}

          if [[ "$BRANCH" == feature/* ]]; then
            TAG=$(echo $GITHUB_SHA | cut -c1-7)

          elif [[ "$BRANCH" == "develop" ]]; then
            TAG=develop

          elif [[ "$BRANCH" == release/* ]]; then
            TAG=$(echo $BRANCH | sed 's|release/||')

          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check Azure Credentials
        id: azure-check
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Azure credentials not configured — skipping Docker build/push"
          fi
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Azure Login
        if: steps.azure-check.outputs.configured == 'true'
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

      - name: Login ACR
        if: steps.azure-check.outputs.configured == 'true'
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Image
        if: steps.azure-check.outputs.configured == 'true'
        run: |
          IMG=$(echo "${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ${IMG}:${GITHUB_SHA::7} \
            -t ${IMG}:${{ steps.tag.outputs.tag }} \
            -t ${IMG}:latest \
            .
          echo "IMG=${IMG}" >> $GITHUB_ENV

      - name: Push Image
        if: steps.azure-check.outputs.configured == 'true'
        run: |
          docker push ${IMG}:${GITHUB_SHA::7}
          docker push ${IMG}:${{ steps.tag.outputs.tag }}
          docker push ${IMG}:latest
