dev:
  resourceGroup: rg-${{ values.projectName }}-dev
  aksCluster: ${{ values.projectName }}-dev-aks
  acaEnvironment: ${{ values.projectName }}-dev-env
  namespace: ${{ values.projectName }}-dev

stage:
  resourceGroup: rg-${{ values.projectName }}-stage
  aksCluster: ${{ values.projectName }}-stage-aks
  acaEnvironment: ${{ values.projectName }}-stage-env
  namespace: ${{ values.projectName }}-stage

prod:
  resourceGroup: rg-${{ values.projectName }}-prod
  aksCluster: ${{ values.projectName }}-prod-aks
  acaEnvironment: ${{ values.projectName }}-prod-env
  namespace: ${{ values.projectName }}-prod
