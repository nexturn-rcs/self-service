trigger:
  branches:
    include:
      - develop
      - feature/*
      - release/*

variables:
  ACR_NAME: ${{ values.acrName }}
  IMAGE_NAME: ${{ values.repoName }}
  PYTHON_VERSION: ${{ values.pythonVersion }}

stages:
  - stage: Test
    displayName: Run Tests
    jobs:
      - job: UnitTests
        displayName: Python Unit Tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            displayName: Set Python version
            inputs:
              versionSpec: $(PYTHON_VERSION)

          - script: |
              pip install -r requirements.txt
              pytest tests/ --junitxml=test-results.xml
            displayName: Install dependencies and run tests

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFiles: test-results.xml
              testRunTitle: Unit Tests

  - stage: Build
    displayName: Build and Push Image
    dependsOn: Test
    condition: succeeded('Test')
    jobs:
      - job: DockerBuild
        displayName: Build and Push to ACR
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: |
              az login --service-principal \
                --username "$(AZURE_CLIENT_ID)" \
                --password "$(AZURE_CLIENT_SECRET)" \
                --tenant "$(AZURE_TENANT_ID)"
              az acr build \
                --registry $(ACR_NAME) \
                --image $(IMAGE_NAME):$(Build.BuildId) \
                --image $(IMAGE_NAME):latest \
                --file Dockerfile .
            displayName: Build and push Docker image to ACR

          - script: |
              echo "##vso[task.setvariable variable=imageTag;isOutput=true]$(Build.BuildId)"
            name: setTag
            displayName: Export image tag for CD pipeline
