name: Performance Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: dev
        type: choice
        options: [dev, stage, prod]
      users:
        description: 'Virtual users'
        required: false
        default: '10'
      ramp_up_seconds:
        description: 'Ramp-up period (seconds)'
        required: false
        default: '30'
      duration_seconds:
        description: 'Test duration (seconds)'
        required: false
        default: '60'
      target_url:
        description: 'Override target URL (leave blank to auto-detect from cluster ingress)'
        required: false
        default: ''

env:
  JMETER_VERSION: 5.6.3

jobs:
  perf-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install JMeter ${{ env.JMETER_VERSION }}
        run: |
          wget -q "https://downloads.apache.org/jmeter/binaries/apache-jmeter-${{ env.JMETER_VERSION }}.tgz"
          tar -xzf "apache-jmeter-${{ env.JMETER_VERSION }}.tgz"
          echo "$PWD/apache-jmeter-${{ env.JMETER_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # ── Resolve cluster config from environments.yaml ───────────────────────

      - name: Resolve environment config
        id: env_cfg
        run: |
          ENV="${{ inputs.environment }}"
          RG=$(yq ".${ENV}.resourceGroup" deploy/environments.yaml)
          AKS=$(yq ".${ENV}.aksCluster"   deploy/environments.yaml)
          NS=$(yq  ".${ENV}.namespace"    deploy/environments.yaml)
          echo "RG=$RG"   | tee -a "$GITHUB_OUTPUT"
          echo "AKS=$AKS" | tee -a "$GITHUB_OUTPUT"
          echo "NS=$NS"   | tee -a "$GITHUB_OUTPUT"
          echo "ENV=$ENV" | tee -a "$GITHUB_OUTPUT"

      # ── Azure + AKS auth ────────────────────────────────────────────────────

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.env_cfg.outputs.RG }}" \
            --name           "${{ steps.env_cfg.outputs.AKS }}" \
            --overwrite-existing
          kubectl get nodes

      # ── Discover target URL ─────────────────────────────────────────────────

      - name: Discover target URL
        id: target
        run: |
          OVERRIDE="${{ inputs.target_url }}"
          if [[ -n "$OVERRIDE" ]]; then
            echo "url=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using provided URL: $OVERRIDE"
            exit 0
          fi

          NS="${{ steps.env_cfg.outputs.NS }}"
          SVC="${{ github.event.repository.name }}"

          # 1. Ingress
          HOST=$(kubectl get ingress -n "$NS" \
            -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || true)
          if [[ -n "$HOST" ]]; then
            TLS=$(kubectl get ingress -n "$NS" \
              -o jsonpath='{.items[0].spec.tls}' 2>/dev/null || true)
            SCHEME="http"
            [[ -n "$TLS" && "$TLS" != "null" ]] && SCHEME="https"
            URL="${SCHEME}://${HOST}"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "Discovered ingress URL: $URL"
            exit 0
          fi

          # 2. LoadBalancer IP / hostname
          LB=$(kubectl get svc "$SVC" -n "$NS" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}' \
            2>/dev/null || true)
          PORT=$(kubectl get svc "$SVC" -n "$NS" \
            -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || true)
          if [[ -n "$LB" ]]; then
            URL="http://${LB}:${PORT}"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "Discovered LoadBalancer URL: $URL"
            exit 0
          fi

          echo "::error::Could not auto-detect target URL for '$SVC' in namespace '$NS'."
          echo "::error::Set the 'target_url' input to override, or configure an Ingress / LoadBalancer."
          exit 1

      # ── Discover Prometheus ─────────────────────────────────────────────────

      - name: Discover Prometheus
        id: prometheus
        run: |
          chmod +x scripts/discover-prometheus.sh
          bash scripts/discover-prometheus.sh \
            --resource-group "${{ steps.env_cfg.outputs.RG }}" \
            --cluster-name   "${{ steps.env_cfg.outputs.AKS }}"
        env:
          # Repo variable fallback — set these in repo Settings → Variables
          # if Prometheus is not auto-detected
          PROMETHEUS_NAMESPACE:    ${{ vars.PROMETHEUS_NAMESPACE    || '' }}
          PROMETHEUS_SERVICE_NAME: ${{ vars.PROMETHEUS_SERVICE_NAME || '' }}
          PROMETHEUS_PORT:         ${{ vars.PROMETHEUS_PORT         || '' }}
        continue-on-error: true

      - name: Port-forward Prometheus
        if: steps.prometheus.outputs.PROM_FOUND == 'true' && steps.prometheus.outputs.PROM_TYPE == 'port-forward'
        run: |
          NS="${{ steps.prometheus.outputs.PROM_NAMESPACE }}"
          SVC="${{ steps.prometheus.outputs.PROM_SVC }}"
          PORT="${{ steps.prometheus.outputs.PROM_PORT }}"
          kubectl port-forward "svc/${SVC}" "9090:${PORT}" -n "$NS" &
          echo "PROM_PF_PID=$!" >> "$GITHUB_ENV"
          sleep 3   # wait for tunnel to be ready
          echo "PROMETHEUS_URL=http://localhost:9090" >> "$GITHUB_ENV"
          echo "Prometheus accessible at http://localhost:9090 (source: ${{ steps.prometheus.outputs.PROM_SOURCE }})"

      - name: Set remote Prometheus URL
        if: steps.prometheus.outputs.PROM_FOUND == 'true' && steps.prometheus.outputs.PROM_TYPE == 'remote'
        run: |
          echo "PROMETHEUS_URL=${{ steps.prometheus.outputs.PROM_URL }}" >> "$GITHUB_ENV"

      # ── Trust target TLS cert (handles self-signed / internal CAs) ──────────

      - name: Trust target server SSL certificate
        run: |
          HOST=$(echo "${{ steps.target.outputs.url }}" | sed 's|.*://||' | cut -d'/' -f1 | cut -d':' -f1)
          PORT_HINT=$(echo "${{ steps.target.outputs.url }}" | grep -oP ':\K\d+' || true)
          [[ -z "$PORT_HINT" ]] && { echo "${{ steps.target.outputs.url }}" | grep -q '^https' && PORT_HINT=443 || PORT_HINT=80; }
          openssl s_client -connect "${HOST}:${PORT_HINT}" -servername "$HOST" \
            </dev/null 2>/dev/null | openssl x509 -outform PEM > /tmp/server.pem || true
          if [ -s /tmp/server.pem ]; then
            cp "$JAVA_HOME/lib/security/cacerts" /tmp/jmeter-cacerts
            keytool -import -trustcacerts -noprompt \
              -alias target-server -file /tmp/server.pem \
              -keystore /tmp/jmeter-cacerts -storepass changeit
            echo "JVM_ARGS=-Djavax.net.ssl.trustStore=/tmp/jmeter-cacerts -Djavax.net.ssl.trustStorePassword=changeit" >> "$GITHUB_ENV"
          fi
        continue-on-error: true

      # ── Parse URL for JMeter ────────────────────────────────────────────────

      - name: Parse target URL
        id: url
        run: |
          TARGET="${{ steps.target.outputs.url }}"
          PROTOCOL=$(echo "$TARGET" | sed 's|://.*||')
          HOSTPORT=$(echo "$TARGET" | sed 's|.*://||' | cut -d'/' -f1)
          HOST=$(echo "$HOSTPORT" | cut -d':' -f1)
          PORT=$(echo "$HOSTPORT" | grep -oP ':\K\d+' || true)
          [[ -z "$PORT" ]] && { [[ "$PROTOCOL" == "https" ]] && PORT=443 || PORT=80; }
          echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"
          echo "host=$HOST"         >> "$GITHUB_OUTPUT"
          echo "port=$PORT"         >> "$GITHUB_OUTPUT"
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ── Run JMeter ──────────────────────────────────────────────────────────

      - name: Create output directories
        run: mkdir -p results/html-report metrics-results

      - name: Run JMeter
        id: jmeter
        run: |
          jmeter -n \
            -t tests/plans/service-api-test.jmx \
            -Jtarget_protocol="${{ steps.url.outputs.protocol }}" \
            -Jtarget_host="${{ steps.url.outputs.host }}" \
            -Jtarget_port="${{ steps.url.outputs.port }}" \
            -Jusers="${{ inputs.users }}" \
            -Jrampup="${{ inputs.ramp_up_seconds }}" \
            -Jduration="${{ inputs.duration_seconds }}" \
            -l results/results.jtl \
            -e -o results/html-report
          echo "end=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Upload jmeter-results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-results
          path: results/
          retention-days: 30

      # ── Wait for Prometheus to scrape post-test data ────────────────────────

      - name: Wait for Prometheus scrape
        if: steps.prometheus.outputs.PROM_FOUND == 'true'
        run: |
          echo "Waiting 3 minutes for Prometheus to scrape post-test metrics..."
          sleep 180

      # ── Collect infrastructure metrics ──────────────────────────────────────

      - name: Collect infrastructure metrics
        if: always()
        env:
          WINDOW_START:      ${{ steps.url.outputs.start }}
          WINDOW_END:        ${{ steps.jmeter.outputs.end }}
          SERVICE_NAMESPACE: ${{ steps.env_cfg.outputs.NS }}
          SERVICE_NAME:      ${{ github.event.repository.name }}
        run: |
          chmod +x scripts/collect-metrics.sh
          bash scripts/collect-metrics.sh \
            --jtl     results/results.jtl \
            --start   "$WINDOW_START" \
            --end     "${WINDOW_END:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" \
            --output  metrics-results/metrics-results.json
        continue-on-error: true

      # ── Cleanup ─────────────────────────────────────────────────────────────

      - name: Stop Prometheus port-forward
        if: always()
        run: |
          [[ -n "${PROM_PF_PID:-}" ]] && kill "$PROM_PF_PID" 2>/dev/null || true

      - name: Upload metrics-results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-results
          path: metrics-results/
          retention-days: 30

      # ── Summary ─────────────────────────────────────────────────────────────

      - name: Test summary
        if: always()
        run: |
          echo "========================================"
          echo "Performance Test Summary"
          echo "========================================"
          echo "Service     : ${{ github.event.repository.name }}"
          echo "Environment : ${{ inputs.environment }}"
          echo "Cluster     : ${{ steps.env_cfg.outputs.AKS }}"
          echo "Namespace   : ${{ steps.env_cfg.outputs.NS }}"
          echo "Target URL  : ${{ steps.target.outputs.url }}"
          echo "Prometheus  : ${PROMETHEUS_URL:-not available}"
          echo "Users       : ${{ inputs.users }}"
          echo "Duration    : ${{ inputs.duration_seconds }}s"
          echo "========================================"
