name: Build

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'release/**'

permissions:
  contents: read
  id-token: write
  packages: write

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VER }}

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Tests
        run: |
          npm test

      - name: Calculate Docker Tag
        id: tag
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}

          if [[ "$BRANCH" == feature/* ]]; then
            TAG=$(echo $GITHUB_SHA | cut -c1-7)

          elif [[ "$BRANCH" == "develop" ]]; then
            TAG=develop

          elif [[ "$BRANCH" == release/* ]]; then
            TAG=$(echo $BRANCH | sed 's|release/||')

          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::7} \
            -t ${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ steps.tag.outputs.tag }} \
            -t ${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:latest \
            .

      - name: Push Image
        run: |
          docker push ${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::7}
          docker push ${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}
          docker push ${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:latest

      - name: Build Summary
        run: |
          echo "Image pushed:"
          echo "${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::7}"
