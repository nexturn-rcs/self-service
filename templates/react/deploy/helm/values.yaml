replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 80

container:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  className: nginx

  annotations: {}

  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5

  targetCPUUtilizationPercentage: 80

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5

config:
  APP_NAME: ${{ values.repoName }}

secret: {}

env: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
