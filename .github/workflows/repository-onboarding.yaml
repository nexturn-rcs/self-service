name: Repository Onboarding

on:
  repository_dispatch:
    types: [servicenow-repo-request]

  workflow_dispatch:
    inputs:
      project_name:
        description: "Project Name (e.g., nextops)"
        required: true
        type: string
      service_name:
        description: "Service / Repository Name (e.g., user-service)"
        required: true
        type: string
      python_version:
        description: "Python Version"
        required: true
        type: string
        default: "3.12"
      description:
        description: "Service Description"
        required: false
        type: string
        default: "Microservice managed via Nexturn RCS automation"
      cicd_system:
        description: "CI/CD destination system"
        required: false
        type: choice
        options:
          - github-action
          - azuredevops
        default: github-action
      snow_ritm_number:
        description: "ServiceNow RITM number (optional for manual test)"
        required: false
        type: string
      snow_ritm_sys_id:
        description: "ServiceNow RITM sys_id (optional)"
        required: false
        type: string
      # ADO destination credentials (non-secret; passed from NexTops Platform Settings at trigger time)
      ado_client_id:
        description: "ADO SPN client ID (required when cicd_system=azuredevops)"
        required: false
        type: string
        default: ""
      ado_tenant_id:
        description: "ADO SPN tenant ID (required when cicd_system=azuredevops)"
        required: false
        type: string
        default: ""
      ado_org_url:
        description: "Azure DevOps org URL, e.g. https://dev.azure.com/myorg"
        required: false
        type: string
        default: ""
      ado_target_project:
        description: "ADO project where the new service repo will be created"
        required: false
        type: string
        default: ""

jobs:
  provision-and-scaffold:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Inputs
        id: inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "project_name=${{ github.event.client_payload.project_name }}" >> "$GITHUB_OUTPUT"
            echo "service_name=${{ github.event.client_payload.service_name }}" >> "$GITHUB_OUTPUT"
            echo "python_version=${{ github.event.client_payload.python_version }}" >> "$GITHUB_OUTPUT"
            echo "description=${{ github.event.client_payload.description }}" >> "$GITHUB_OUTPUT"
            echo "cicd_system=${{ github.event.client_payload.cicd_system || 'github-action' }}" >> "$GITHUB_OUTPUT"
            echo "snow_ritm_number=${{ github.event.client_payload.snow_ritm_number }}" >> "$GITHUB_OUTPUT"
            echo "snow_ritm_sys_id=${{ github.event.client_payload.snow_ritm_sys_id }}" >> "$GITHUB_OUTPUT"
            echo "ado_client_id=${{ github.event.client_payload.ado_client_id }}" >> "$GITHUB_OUTPUT"
            echo "ado_tenant_id=${{ github.event.client_payload.ado_tenant_id }}" >> "$GITHUB_OUTPUT"
            echo "ado_org_url=${{ github.event.client_payload.ado_org_url }}" >> "$GITHUB_OUTPUT"
            echo "ado_target_project=${{ github.event.client_payload.ado_target_project }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_name=${{ github.event.inputs.project_name }}" >> "$GITHUB_OUTPUT"
            echo "service_name=${{ github.event.inputs.service_name }}" >> "$GITHUB_OUTPUT"
            echo "python_version=${{ github.event.inputs.python_version }}" >> "$GITHUB_OUTPUT"
            echo "description=${{ github.event.inputs.description }}" >> "$GITHUB_OUTPUT"
            echo "cicd_system=${{ github.event.inputs.cicd_system }}" >> "$GITHUB_OUTPUT"
            echo "snow_ritm_number=${{ github.event.inputs.snow_ritm_number }}" >> "$GITHUB_OUTPUT"
            echo "snow_ritm_sys_id=${{ github.event.inputs.snow_ritm_sys_id }}" >> "$GITHUB_OUTPUT"
            echo "ado_client_id=${{ github.event.inputs.ado_client_id }}" >> "$GITHUB_OUTPUT"
            echo "ado_tenant_id=${{ github.event.inputs.ado_tenant_id }}" >> "$GITHUB_OUTPUT"
            echo "ado_org_url=${{ github.event.inputs.ado_org_url }}" >> "$GITHUB_OUTPUT"
            echo "ado_target_project=${{ github.event.inputs.ado_target_project }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Self-Service Repo
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare Workspace
        run: mkdir workspace_repo

      # ── GitHub Actions destination path ────────────────────────────────────────
      - name: Install GitHub Dependencies
        if: steps.inputs.outputs.cicd_system == 'github-action'
        run: pip install requests

      - name: Run GitHub Onboarding Engine
        if: steps.inputs.outputs.cicd_system == 'github-action'
        env:
          PLATFORM_AUTOMATION_TOKEN: ${{ secrets.PLATFORM_AUTOMATION_TOKEN }}
          GITHUB_ORG: ${{ vars.GITHUB_ORG || 'nexturn-rcs' }}
          SERVICE_NAME: ${{ steps.inputs.outputs.service_name }}
          PROJECT_NAME: ${{ steps.inputs.outputs.project_name }}
          PYTHON_VERSION: ${{ steps.inputs.outputs.python_version }}
          DESCRIPTION: ${{ steps.inputs.outputs.description }}
          ACR_NAME: ${{ vars.ACR_NAME || 'nextopsacrdemo' }}
          SOURCE_TEMPLATE_DIR: templates/python/github-action
        run: python bootstrap.py

      - name: Set GitHub Repo Variables and Secrets
        if: steps.inputs.outputs.cicd_system == 'github-action'
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_AUTOMATION_TOKEN }}
          REPO_SLUG: "${{ vars.GITHUB_ORG || 'nexturn-rcs' }}/${{ steps.inputs.outputs.service_name }}"
          AZURE_CLIENT_ID: ${{ secrets.GLOBAL_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.GLOBAL_AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.GLOBAL_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.GLOBAL_AZURE_SUBSCRIPTION_ID }}
        run: |
          gh variable set PROJECT_NAME --body "${{ steps.inputs.outputs.project_name }}" --repo "$REPO_SLUG"
          gh variable set PYTHON_VER --body "${{ steps.inputs.outputs.python_version }}" --repo "$REPO_SLUG"
          gh variable set ACR_NAME --body "${{ vars.ACR_NAME || 'nextopsacrdemo' }}" --repo "$REPO_SLUG"
          gh variable set DEPLOY_TARGET --body "AKS" --repo "$REPO_SLUG"
          AZURE_JSON='{"clientId":"'"$AZURE_CLIENT_ID"'","clientSecret":"'"$AZURE_CLIENT_SECRET"'","subscriptionId":"'"$AZURE_SUBSCRIPTION_ID"'","tenantId":"'"$AZURE_TENANT_ID"'"}'
          gh secret set AZURE_CREDENTIALS --body "$AZURE_JSON" --repo "$REPO_SLUG"
          gh secret set AZURE_CLIENT_ID --body "$AZURE_CLIENT_ID" --repo "$REPO_SLUG"
          gh secret set AZURE_CLIENT_SECRET --body "$AZURE_CLIENT_SECRET" --repo "$REPO_SLUG"
          gh secret set AZURE_TENANT_ID --body "$AZURE_TENANT_ID" --repo "$REPO_SLUG"
          gh secret set AZURE_SUBSCRIPTION_ID --body "$AZURE_SUBSCRIPTION_ID" --repo "$REPO_SLUG"

      - name: Push to GitHub Repo
        if: steps.inputs.outputs.cicd_system == 'github-action'
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_AUTOMATION_TOKEN }}
          GITHUB_ORG: ${{ vars.GITHUB_ORG || 'nexturn-rcs' }}
        run: |
          cd workspace_repo
          git init && git checkout -b develop
          git config user.name "Platform Automation Bot"
          git config user.email "platform-team@nexturn.com"
          git add . && git commit -m "bootstrap: initial boilerplate generation from template"
          git remote add origin "https://x-access-token:${{ secrets.PLATFORM_AUTOMATION_TOKEN }}@github.com/$GITHUB_ORG/${{ steps.inputs.outputs.service_name }}.git"
          git push -u origin develop --force
          gh repo edit "$GITHUB_ORG/${{ steps.inputs.outputs.service_name }}" --default-branch develop

      # ── Azure DevOps destination path ───────────────────────────────────────────
      - name: Install ADO Dependencies
        if: steps.inputs.outputs.cicd_system == 'azuredevops'
        run: pip install requests msal

      - name: Run ADO Onboarding Engine
        if: steps.inputs.outputs.cicd_system == 'azuredevops'
        env:
          SERVICE_NAME: ${{ steps.inputs.outputs.service_name }}
          PROJECT_NAME: ${{ steps.inputs.outputs.project_name }}
          PYTHON_VERSION: ${{ steps.inputs.outputs.python_version }}
          DESCRIPTION: ${{ steps.inputs.outputs.description }}
          ACR_NAME: ${{ vars.ACR_NAME || 'nextopsacrdemo' }}
          ADO_CLIENT_ID: ${{ steps.inputs.outputs.ado_client_id }}
          ADO_CLIENT_SECRET: ${{ secrets.ADO_CLIENT_SECRET }}
          ADO_TENANT_ID: ${{ steps.inputs.outputs.ado_tenant_id }}
          ADO_ORG_URL: ${{ steps.inputs.outputs.ado_org_url }}
          ADO_TARGET_PROJECT: ${{ steps.inputs.outputs.ado_target_project }}
          AZURE_CLIENT_ID: ${{ secrets.GLOBAL_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.GLOBAL_AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.GLOBAL_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.GLOBAL_AZURE_SUBSCRIPTION_ID }}
          SOURCE_TEMPLATE_DIR: templates/python/azuredevops
        run: python scripts/bootstrap_ado.py

      # ── ServiceNow status update (both paths) ───────────────────────────────────
      - name: ServiceNow - Mark Success
        if: ${{ success() && (steps.inputs.outputs.snow_ritm_number != '' || steps.inputs.outputs.snow_ritm_sys_id != '') }}
        env:
          SNOW_INSTANCE_URL: ${{ secrets.SNOW_INSTANCE_URL }}
          SNOW_USERNAME: ${{ secrets.SNOW_USERNAME }}
          SNOW_PASSWORD: ${{ secrets.SNOW_PASSWORD }}
          RITM_NUMBER: ${{ steps.inputs.outputs.snow_ritm_number }}
          RITM_SYS_ID: ${{ steps.inputs.outputs.snow_ritm_sys_id }}
          REPO_NAME: ${{ steps.inputs.outputs.service_name }}
        run: python scripts/update_snow_ritm.py --mode success

      - name: ServiceNow - Mark Failed
        if: ${{ failure() && (steps.inputs.outputs.snow_ritm_number != '' || steps.inputs.outputs.snow_ritm_sys_id != '') }}
        env:
          SNOW_INSTANCE_URL: ${{ secrets.SNOW_INSTANCE_URL }}
          SNOW_USERNAME: ${{ secrets.SNOW_USERNAME }}
          SNOW_PASSWORD: ${{ secrets.SNOW_PASSWORD }}
          RITM_NUMBER: ${{ steps.inputs.outputs.snow_ritm_number }}
          RITM_SYS_ID: ${{ steps.inputs.outputs.snow_ritm_sys_id }}
          REPO_NAME: ${{ steps.inputs.outputs.service_name }}
        run: python scripts/update_snow_ritm.py --mode failed
